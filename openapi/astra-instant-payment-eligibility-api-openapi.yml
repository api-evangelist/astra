openapi: 3.2.0
info:
  title: Astra Developer Instant Payment Eligibility API
  description: Astra's public API endpoints available to our customers.
  version: 1.0.0
servers:
- url: https://api-sandbox.astra.finance
  description: Sandbox Environment
- url: https://secure.api-sandbox.astra.finance
  description: Secure Sandbox URL
tags:
- name: Instant Payment Eligibility
paths:
  /v1/instant-payment-eligibility:
    get:
      tags:
      - Instant Payment Eligibility
      summary: Get Account Routing Number Instant Payment Eligibility
      description: '> 📘

        >

        > You can place your application''s `client_id` into the `username` field, and your `client_secret` into the `password` form field of the Authentication section of this documentation 👉.


        Use this endpoint to check if an account is eligible for instant payments.'
      security:
      - basicAuth: []
      parameters:
      - name: routing_number
        in: query
        description: The routing number of the account
        required: false
        schema:
          type: string
      - name: institution_routing_number
        in: query
        description: The institution routing number
        required: false
        schema:
          type: string
      - name: participant_id
        in: query
        description: Identification number assigned to a participant in the payment network
        required: false
        schema:
          type: string
      - name: cursor_id
        in: query
        description: The pagination cursor ID.  When specified, allows one to navigate between pages.  If not specified the first page of results will be returned.
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        description: The maximum number of items returned with each request.  Defaults to 25 if not specified.
        required: false
        schema:
          type: integer
          minimum: 10
          maximum: 100
      responses:
        '200':
          description: Successfully retrieved instant payment eligibility information
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    description: List of routing number records
                    items:
                      type: object
                      properties:
                        institution_routing_number:
                          type: string
                          description: The routing number of the institution
                        name:
                          type: string
                          description: Name of the financial institution
                        network_platform:
                          type: string
                          description: The payment network platform
                          enum:
                          - FedNow
                          - TCH
                        online_status:
                          type: string
                          description: Current online status
                          enum:
                          - SignedOn
                          - SignedOff
                        participant_id:
                          type: string
                          description: Identification number assigned to a participant in the payment network
                        receive_enabled:
                          type: boolean
                          description: Indicates if the account can receive instant payments
                        routing_number:
                          type: string
                          description: The routing number of the account
                  count:
                    type: integer
                    description: Total number of results returned
                  has_next_page:
                    type: boolean
                    description: Indicates if there are additional results available
                  next_cursor_id:
                    type: string
                    description: Cursor identifier to retrieve the next page of results
        '400':
          description: Bad Request
          headers:
            request-id:
              $ref: '#/components/headers/request-id'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/generic_error'
                - $ref: '#/components/schemas/validation_error'
      operationId: getV1InstantPaymentEligibility
      x-operation-id-source: derived
components:
  schemas:
    validation_error:
      type: object
      properties:
        status_code:
          description: HTTP Response code
          type: integer
        description:
          description: Object of invalid fields with accompanying descriptions
          type: object
    generic_error:
      type: object
      properties:
        code:
          description: Response code
          type: integer
        name:
          description: Name of response code
          type: string
        description:
          description: Error message
          type: string
  headers:
    request-id:
      description: Unique ID returned with each API response
      schema:
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer

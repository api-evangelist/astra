                  ssn: '1234'
                  phone: YOUR_PHONE
                  email: YOUR_EMAIL
                  address1: 123 Astra Ave
                  city: Palo Alto
                  state: CA
                  postal_code: '94304'
                  ip_address: 192.0.2.0

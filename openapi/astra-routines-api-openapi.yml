components:
  examples:
    routine_error_start_date:
      summary: Invalid Start Date
      value:
        status_code: 400
        description:
          start_date:
          - Start date must be in the format YYYY-MM-DD.
    routine_error_type:
      summary: Invalid Type
      value:
        status_code: 400
        description:
          type:
          - Invalid routine type.
    routine_error_card_type:
      summary: Card type
      value:
        code: 400
        name: Bad Request
        description: Both source and destination must be debit cards.
    routine_error_velocity_limit:
      summary: Velocity limit
      value:
        code: 400
        name: Bad Request
        description: User has reached the velocity limit for debit transfers.
    routine_error_invalid_field_combo:
      summary: Invalid Routine Field Combination
      value:
        status_code: 400
        description:
          _schema:
          - A routine cannot have 'amount' and 'percent_of_transaction' simultaneously.
          - A routine cannot have 'amount' and 'percent_of_balance' simultaneously.
          - A routine cannot have 'amount' and 'minimum_transaction_threshold' simultaneously.
          - Percent of transaction and percent of balance cannot both be set.
    routine_error_customer_debit_fee:
      summary: Invalid Customer Debit Fee Percent

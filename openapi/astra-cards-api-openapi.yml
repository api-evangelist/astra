        > You can place the bearer `access_token` for a specific user into the Authentication section of this documentation 👉.


        This endpoint retrieves a specific Debit Card for a User based on the unique Card ID.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        description: The unique ID of the Card
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          headers:
            request-id:
              $ref: '#/components/headers/request-id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique card ID
                  active:
                    type: boolean
                    description: Whether or not the card is active with the issuing bank
                  address_verified:
                    type: boolean
                    description: AVS response from debit networks
                  card_company:
                    type: string
                    description: Name of card company
                  card_fingerprint:
                    type: string
                    description: A unique identifier derived from the card number
                  card_type:
                    type: string
                    description: The type of card
                    enum:
                    - debit
                    - prepaid
                    - credit
                    - unknown
                  city:
                    type: string
                    description: The city of the card billing address
                  created:
                    type: string
                    format: date-time
                    description: Date and time of card creation
                  expiration_date:
                    type: string
                    description: Month/Year of card expiration
                  first_name:
                    type: string
                    description: The first name of card user
                  first_six_digits:
                    type: string
                    description: The provided Bank Identification Number (BIN)
                  last_four_digits:
                    type: string
                    description: Last 4 digits of the card number
                  last_name:
                    type: string
                    description: The last name of card user
                  name_verification_result:
                    type: string
                    description: The ANI results from the issuing bank of the card
                    enum:
                    - Match
                    - No Match
                    - Partial Match
                    - Unknown
                  product_type:
                    type: string
                    description: The product type of the card
                    enum:
                    - Consumer
                    - Business
                    - Commercial
                    - Unknown
                  pull_enabled:
                    type: boolean
                    description: Whether or not the card is enabled for pull transactions
                  push_enabled:
                    type: boolean
                    description: Whether or not the card is enabled for push transactions
                  aft_enabled:
                    type: boolean
                    description: If true, this card is allowed to be used as a source in routines.
                  oct_enabled:
                    type: boolean
                    description: If true, this card is allowed to be used as a desetination in routines.
                  removed:
                    type: boolean
                    description: Whether or not the user has removed the card
                  review_reasons:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: The review reason code (see [Card Review Reasons](https://docs.astra.finance/reference/card-review-statuses#review-reasons))
                        description:
                          type: string
                          description: The review reason description (see [Card Review Reasons](https://docs.astra.finance/reference/card-review-statuses#review-reasons))
                  reviewed_at:
                    type: string
                    format: date-time
                    description: The date and time the Card was reviewed
                  review_status:
                    type: string
                    description: (Deprecated) Review status of the card
                    enum:
                    - approved
                    - flagged
                    - rejected
                  state:
                    type: string
                    description: Card address state
                  status:
                    type: string
                    description: The status of the card ([Card Statuses](https://docs.astra.finance/reference/card-review-statuses#card-statuses))
                    enum:
                    - approved
                    - flagged
                    - rejected
                    - removed
                  street_line_1:
                    type: string
                    description: The street line 1 of the card billing address
                  street_line_2:
                    type: string
                    description: The street line 2 of the card billing address
                  zip_code:
                    type: string
                    description: The zip code of the card billing address
        '401':
          description: Unauthorized
          headers:
            request-id:
              $ref: '#/components/headers/request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
              examples:
                generic_error_unauthorized:
                  $ref: '#/components/examples/generic_error_unauthorized'
      operationId: getV1CardsById
      x-operation-id-source: derived
    delete:
      tags:
      - Cards
      summary: Delete a Card
      description: '> 📘

        >

        > You can place the bearer `access_token` for a specific user into the Authentication section of this documentation 👉.


        This endpoint deletes a debit card by way of a card''s unique ID. If the card is successfully deleted, you''ll receive an HTTP 200 OK response.


        > 🚧

        >

        > Astra will only delete cards that were added by the requesting OAuth Client. End-users can delete cards through the Web App.


        > ❗️

        >

        > A card can only be deleted if there are no active routines or pending transfers associated with it.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        description: The unique ID of the Card
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized
          headers:
            request-id:
              $ref: '#/components/headers/request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
              examples:
                generic_error_unauthorized:
                  $ref: '#/components/examples/generic_error_unauthorized'
      operationId: deleteV1CardsById
      x-operation-id-source: derived
  /v1/cards/{id}/approve:
    post:
      tags:
      - Cards
      summary: Approve a Card by an ID
      description: '> 📘

        >

        > You can place the bearer `access_token` for a specific user into the Authentication section of this documentation 👉.


        This endpoint gives eligible clients the ability to approve a flagged Card by way of the card''s unique ID.


        > 🚧

        >

        > Your Astra OAuth Client must be enabled for this resource. Only flagged Cards can be approved, and the User must be approved in order to have their card(s) actioned.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        description: The unique ID of the Card
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          headers:
            request-id:
              $ref: '#/components/headers/request-id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique card ID
                  active:
                    type: boolean
                    description: Whether or not the card is active with the issuing bank
                  address_verified:
                    type: boolean
                    description: AVS response from debit networks
                  aft_enabled:
                    type: boolean
                    description: If true, this card is allowed to be used as a source in routines.
                  card_company:
                    type: string
                    description: Name of card company
                  card_fingerprint:
                    type: string
                    description: A unique identifier derived from the card number
                  card_type:
                    type: string
                    description: The type of card
                    enum:
                    - debit
                    - prepaid
                    - credit
                    - unknown
                  city:
                    type: string
                    description: The city of the card billing address
                  country:
                    type: string
                    description: The country of the card billing address
                  created:
                    type: string
                    format: date-time
                    description: Date and time of card creation
                  expiration_date:
                    type: string
                    description: Month/Year of card expiration
                  first_name:
                    type: string
                    description: The first name of card user
                  first_six_digits:

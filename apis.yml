aid: astra
name: Astra
description: >-
  Astra (Astra Finance, Inc.) is a financial technology company providing an
  all-in-one instant payments API that lets product teams embed real-time money
  movement between bank accounts and debit cards. The platform powers instant
  disbursements and payouts, instant account funding, accelerated bank
  transfers, card-to-account movement, cross-border payments, and automated
  "Routines," with built-in compliance, fraud detection, and chargeback
  management. Developers integrate over a versioned REST API (v1) using OAuth
  2.0 authorization for end-user money movement plus client-credential
  authorization for administrative operations, with webhooks for asynchronous
  updates and a full sandbox environment for testing.
